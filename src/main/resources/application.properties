# Server
server.port=8080

# H2 in-memory database (switch to MySQL below for production use)
spring.datasource.url=jdbc:h2:mem:resumedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To use MySQL instead, comment the H2 block above and uncomment below ---
# spring.datasource.url=jdbc:mysql://localhost:3306/resume_builder_db?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

# Default admin account created on startup
app.admin.email=admin@resumebuilder.com
app.admin.password=Admin@123
